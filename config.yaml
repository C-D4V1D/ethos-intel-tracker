# Ethos European Data Centre Intelligence Tracker - settings
# Edit these values; no code changes needed.

serpapi:
  # Free plan = 250 searches/month. Each AI Mode or News query = 1 search.
  monthly_budget: 230          # hard stop, leaves headroom under 250
  ai_mode_per_run: 25          # projects checked by Google AI Mode per run (all of them)
  news_per_run: 12             # only used when news.source = serpapi
  rescan_after_days: 6         # every project re-checked weekly (~100 searches/month)
  hl: en                       # result language
  gl: uk                       # Google country edition

news:
  source: rss                  # rss = free Google News RSS (no key); serpapi = uses SerpApi credits

tenders:                       # free official APIs, no key: EU TED + UK Find a Tender
  enabled: true
  lookback_days: 90
  max_results: 50
  fts_max_pages: 15
  keywords: ["data centre", "data center", "datacenter", "centro de datos", "centre de données",
             "Rechenzentrum", "datacenter", "data centro", "datacentre"]
  countries: ["Spain", "Germany", "France", "Italy", "Sweden", "Ireland", "Denmark"]
  # Only construction, engineering and M&E categories (CPV codes, hierarchical):
  # 45 construction works, 71 architecture/engineering, 425 cooling/ventilation,
  # 31 electrical equipment, 39717 HVAC appliances, 507 building M&E repair, 093 energy
  cpv: ["45000000", "71000000", "42500000", "31000000", "39717000", "50700000", "09300000"]

auto_update:
  max_minutes: 40              # stop the AI step cleanly after this; the rest is picked up next week

discovery:                     # weekly search for NEW projects (AI Mode + market news, Gemini, source check)
  markets: ["Spain", "United Kingdom", "Germany", "France", "Ireland", "Sweden", "Italy"]
  max_new_per_market: 3        # ~30 searches/month

gemini:                        # free tier; needs the GEMINI_API_KEY secret
  enabled: true
  max_per_run: 25
  pause_seconds: 5
  models: ["gemini-3.5-flash-lite", "gemini-3.6-flash", "gemini-flash-lite-latest", "gemini-flash-latest"]

freshness:
  amber_days: 90               # source/project not checked for 90+ days -> amber
  red_days: 180                # 180+ days -> red

source_check:
  timeout_seconds: 20
  max_per_run: 200

grid_data:
  spain_months_back: 24        # Red Electrica monthly history to keep
  decree_threshold_pct: 90     # RD 1032/2026: rules ease once renewables pass 90%

ai_scan:
  # Words in an AI Mode answer that suggest a stage change.
  stage_keywords:
    Operational: ["operational", "opened", "went live", "in operation", "inaugurat"]
    Under construction: ["under construction", "construction began", "broke ground", "groundbreaking", "construction started"]
    Permitted: ["approved", "granted permission", "planning permission granted", "permit granted", "consent granted"]
    Permitting: ["planning application", "submitted", "consultation", "environmental impact", "under review"]
    Cancelled / paused: ["cancelled", "canceled", "paused", "withdrawn", "shelved", "rejected", "refused"]

workbook:
  title: "European Data Centre Pipeline & Grid Intelligence Tracker"
  prepared_by: "David Chukwuemeka"
  repo_url: "https://github.com/C-D4V1D/ethos-intel-tracker"
  latest_download: "https://github.com/C-D4V1D/ethos-intel-tracker/releases/latest/download/Ethos_European_DC_Intelligence_Tracker.xlsx"

onedrive:                      # live copy (needs the one-time "Connect OneDrive" workflow)
  folder: "Ethos Intelligence Tracker"
