name: Connect OneDrive (one time)

# Run this once from the Actions tab. Open the job log: it shows a code.
# Go to https://microsoft.com/devicelogin, enter the code and sign in.
# The workbook is then uploaded to your OneDrive and the share link printed at the end of the log.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Get the latest workbook
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p output && gh release download latest -p "*.xlsx" -D output --clobber
      - name: Sign in to Microsoft (see the code below) and upload
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONUNBUFFERED: "1"
        run: python -m tracker.onedrive connect --then-push
      - name: Save the share link
        run: |
          git config user.name  "intel-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/onedrive.json && git commit -m "OneDrive connected" && git push || true
